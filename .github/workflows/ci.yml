name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv, not pip -- this project family's standing rule.
      - uses: astral-sh/setup-uv@v6
      - name: Create venv and install with dev extras
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Migrations are up to date
        run: .venv/bin/python -m llm_ledger.standalone.manage makemigrations --check --dry-run
      - name: Test suite
        run: .venv/bin/python -m pytest -v
