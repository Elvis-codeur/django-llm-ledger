[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "django-llm-ledger"
version = "0.1.0"
description = "A reusable Django app that tracks LLM API cost/usage (runs, calls, historical model pricing) -- drop into an existing project's INSTALLED_APPS, or run standalone as its own service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "django-filter>=23",
]

[project.optional-dependencies]
standalone = ["gunicorn>=22"]
dev = ["pytest>=8", "pytest-django>=4"]

[tool.setuptools.packages.find]
include = ["llm_ledger*"]
